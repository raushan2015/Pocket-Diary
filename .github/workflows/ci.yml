# Pocket Diary CI Pipeline
# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Lint, Typecheck & Frontend Bundle
  # ─────────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            mobile-apps/package-lock.json
            tests/package-lock.json

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
          cd ../mobile-apps && npm ci
          cd ../tests && npm ci

      - name: Backend typecheck & build
        run: cd backend && npm run build

      - name: Frontend Vite build
        run: cd frontend && npm run build

      - name: Mobile typecheck
        run: cd mobile-apps && npm run typecheck

      - name: Mobile lint
        run: cd mobile-apps && npm run lint

  # ─────────────────────────────────────────────────────────────────────
  # Backend Tests (Unit + Integration + Migrations)
  # ─────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Build backend
        run: cd backend && npm run build

      - name: Run backend tests
        run: cd backend && npm test
        env:
          NODE_ENV: test
          COOKIE_SECRET: test-secret-minimum-32-chars-long
          APP_URL: http://localhost:3000
          DATABASE_PATH: ':memory:'
          SMTP_HOST: ''
          VAPID_PUBLIC_KEY: ''
          VAPID_PRIVATE_KEY: ''

  # ─────────────────────────────────────────────────────────────────────
  # Frontend Unit Tests (Markdown, XSS, Import, i18n)
  # ─────────────────────────────────────────────────────────────────────
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install test deps
        run: cd tests && npm ci

      - name: Run frontend unit tests
        run: cd tests && npm run test:unit

  # ─────────────────────────────────────────────────────────────────────
  # Mobile Tests (Unit + Offline Sync)
  # ─────────────────────────────────────────────────────────────────────
  mobile-tests:
    name: Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            mobile-apps/package-lock.json

      - name: Build backend (required by mobile real-backend tests)
        run: cd backend && npm ci && npm run build

      - name: Install mobile deps
        run: cd mobile-apps && npm ci

      - name: Run mobile tests
        run: cd mobile-apps && npm test

  # ─────────────────────────────────────────────────────────────────────
  # E2E Tests (Playwright) - Boots ephemeral stack inside same step
  # ─────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, backend-tests, frontend-unit]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            tests/package-lock.json

      - name: Install dependencies & build
        run: |
          cd backend && npm ci && npm run build
          cd ../frontend && npm ci && npm run build && cp server.js dist/
          cd ../tests && npm ci && npx playwright install chromium --with-deps

      - name: Run browser journeys (AI mock + backend + frontend proxy)
        env:
          BASE_URL: http://127.0.0.1:8080
          AI_MOCK_URL: http://127.0.0.1:9971
        run: |
          set -euo pipefail
          mkdir -p /tmp/notes-e2e/attachments /tmp/notes-e2e/agy-homes /tmp/notes-e2e/agy-sandbox

          MOCK_PROVIDER_PORT=9971 node scripts/ai-mock-provider.mjs > /tmp/notes-e2e/ai-mock.log 2>&1 &
          MOCK_PID=$!

          (
            cd backend
            NODE_ENV=development \
            COOKIE_SECRET=test-secret-minimum-32-chars-long \
            APP_URL=http://127.0.0.1:8080 \
            DATABASE_PATH=/tmp/notes-e2e/memo_manager.db \
            ATTACHMENTS_DIR=/tmp/notes-e2e/attachments \
            BACKEND_PORT=3000 \
            RATE_LIMIT_MAX=5000 \
            AUTH_RATE_LIMIT_MAX=5000 \
            REMINDER_SCAN_INTERVAL_MS=10000 \
            AI_CREDENTIAL_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            AI_OPENAI_BASE_URL=http://127.0.0.1:9971 \
            node dist/index.js > /tmp/notes-e2e/backend.log 2>&1
          ) &
          BACKEND_PID=$!

          (
            cd frontend
            FRONTEND_PORT=8080 \
            BACKEND_URL=http://127.0.0.1:3000 \
            node dist/server.js > /tmp/notes-e2e/frontend.log 2>&1
          ) &
          FRONTEND_PID=$!

          trap 'kill "$MOCK_PID" "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "Ephemeral instance is up"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then
            echo "Instance failed to become ready; logs follow"
            cat /tmp/notes-e2e/ai-mock.log /tmp/notes-e2e/backend.log /tmp/notes-e2e/frontend.log || true
            exit 1
          fi

          cd tests
          npm test

      - name: Dump logs on failure
        if: failure()
        run: cat /tmp/notes-e2e/ai-mock.log /tmp/notes-e2e/backend.log /tmp/notes-e2e/frontend.log 2>/dev/null || true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Docker Build Verification
  # ─────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck, backend-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
