# Continuous Integration for Memo Manager SaaS
#
# Audit §6 asked for the Playwright e2e suite to run against an ephemeral
# instance in CI. This workflow runs:
#   1. backend  — typecheck + vitest suite
#   2. unit     — frontend Markdown/import unit + XSS regression tests
#   3. e2e      — the full browser journey suite against a throwaway
#                 backend + frontend booted inside the job
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: backend
      - name: Test
        run: npm test
        working-directory: backend

  frontend-unit:
    name: Frontend unit (markdown + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
        working-directory: tests
      - name: Unit + XSS regression tests
        run: npm run test:unit
        working-directory: tests

  e2e:
    name: E2E (browser journeys, ephemeral instance)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install test dependencies + Chromium
        run: |
          npm ci
          npx playwright install chromium --with-deps
        working-directory: tests

      # Throwaway instance: dev-mode backend (fresh temp SQLite) + static
      # frontend proxy. It MUST be started in the same step that runs the
      # journeys: GitHub's runner tears down every process a step spawned
      # once that step exits, so a separate "boot" step gets its background
      # services killed before the test step begins — every journey then
      # fails with ERR_CONNECTION_REFUSED (found the hard way on the first
      # CI run). A trap stops the instance when this step ends, pass or fail.
      - name: Run browser journeys (boots the ephemeral instance)
        env:
          BASE_URL: http://127.0.0.1:8080
        run: |
          set -euo pipefail

          mkdir -p /tmp/notes-e2e
          cd backend

          # Rate limits are raised and the reminder scan is sped up (10 s)
          # because all CI traffic shares one client IP and the reminder
          # journeys poll for ~30 s; per-account lockout still applies.
          NODE_ENV=development \
          DATABASE_PATH=/tmp/notes-e2e/memo_manager.db \
          ATTACHMENTS_DIR=/tmp/notes-e2e/attachments \
          BACKEND_PORT=3000 \
          RATE_LIMIT_MAX=5000 \
          AUTH_RATE_LIMIT_MAX=5000 \
          REMINDER_SCAN_INTERVAL_MS=10000 \
          npx tsx src/index.ts > /tmp/notes-e2e/backend.log 2>&1 &
          BACKEND_PID=$!

          cd ../frontend
          FRONTEND_PORT=8080 \
          BACKEND_URL=http://127.0.0.1:3000 \
          node server.js > /tmp/notes-e2e/frontend.log 2>&1 &
          FRONTEND_PID=$!

          trap 'kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "Ephemeral instance is up"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then
            echo "Instance failed to become ready; logs follow"
            cat /tmp/notes-e2e/backend.log /tmp/notes-e2e/frontend.log
            exit 1
          fi

          cd ../tests
          npm test

      - name: Dump instance logs on failure
        if: failure()
        run: cat /tmp/notes-e2e/backend.log /tmp/notes-e2e/frontend.log || true
