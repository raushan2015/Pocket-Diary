# Memo Manager SaaS Docker Compose Orchestration
# TECHSHAN AI Office

services:
  memo-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: memo-manager:latest
    container_name: memo-manager-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - BACKEND_PORT=3000
      - DATABASE_PATH=/app/data/memo_manager.db
      - COOKIE_SECRET=${COOKIE_SECRET:?Set a unique COOKIE_SECRET of at least 32 characters in your .env file}
      # Public URL used in reminder emails, invitation and password-reset links.
      # REQUIRED (audit C-3): the backend refuses to start without it in
      # production — email links are never derived from request headers.
      - APP_URL=${APP_URL:?Set APP_URL to your public URL, e.g. https://notes.example.com (required for password-reset/invite links)}
      # Whose X-Forwarded-For header is trusted for rate limiting (audit H-1).
      - TRUST_PROXY=${TRUST_PROXY:-127.0.0.1}
      # Server-side reminder scanning (default 30s)
      - REMINDER_SCAN_INTERVAL_MS=${REMINDER_SCAN_INTERVAL_MS:-}
      # Optional SMTP email delivery for reminders and invitations
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Notes <no-reply@notes.local>}
      # Optional Web Push (VAPID) credentials for browser push reminders
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@notes.local}
      # Backups: local cadence + optional off-host replication directory
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_RETENTION=${BACKUP_RETENTION:-7}
      - BACKUP_REPLICATION_DIR=${BACKUP_REPLICATION_DIR:-}
      - BACKUP_REPLICATION_RETENTION=${BACKUP_REPLICATION_RETENTION:-7}
      # Global request budget per minute
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-300}
    volumes:
      # Mount the replication directory when configured so snapshots are
      # copied outside the data volume:
      # - /mnt/backups/notes-replica:/app/backup-replica
      - memo_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  memo_data:
    name: memo_manager_data
