# Pocket Diary CI/CD Pipeline
# .github/workflows/ci.yml

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deploy environment'
        required: true
        type: choice
        options: [staging, production]
      skip_tests:
        description: 'Skip tests (emergency only)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Lint & Typecheck (Fast, runs on every PR)
  # ─────────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            mobile-apps/package-lock.json
            tests/package-lock.json

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci
          cd ../mobile-apps && npm ci
          cd ../tests && npm ci

      - name: Backend typecheck
        run: cd backend && npx tsc --noEmit

      - name: Backend lint
        run: cd backend && npm run lint 2>/dev/null || echo "No lint script"

      - name: Mobile typecheck
        run: cd mobile-apps && npm run typecheck

      - name: Mobile lint
        run: cd mobile-apps && npm run lint

      - name: Frontend lint (basic)
        run: cd frontend && npx eslint js/ --ext .js || echo "No eslint config"

  # ─────────────────────────────────────────────────────────────────────
  # Backend Tests (Unit + Integration)
  # ─────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # No external services needed - uses in-memory SQLite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Build backend
        run: cd backend && npm run build

      - name: Run backend tests
        run: cd backend && npm test
        env:
          NODE_ENV: test
          COOKIE_SECRET: test-secret-minimum-32-chars-long
          APP_URL: http://localhost:3000
          DATABASE_PATH: :memory:
          SMTP_HOST: ''
          VAPID_PUBLIC_KEY: ''
          VAPID_PRIVATE_KEY: ''

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage/lcov.info
          flags: backend

  # ─────────────────────────────────────────────────────────────────────
  # Mobile Tests (Unit)
  # ─────────────────────────────────────────────────────────────────────
  mobile-tests:
    name: Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile-apps/package-lock.json

      - name: Install mobile deps
        run: cd mobile-apps && npm ci

      - name: Run mobile tests
        run: cd mobile-apps && npm test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: mobile-apps/coverage/lcov.info
          flags: mobile

  # ─────────────────────────────────────────────────────────────────────
  # E2E Tests (Playwright) - Requires running instance
  # ─────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, backend-tests]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            tests/package-lock.json

      - name: Install deps
        run: |
          cd backend && npm ci
          cd ../tests && npm ci

      - name: Build backend
        run: cd backend && npm run build

      - name: Start test instance
        run: |
          cd backend
          NODE_ENV=test \
          COOKIE_SECRET=test-secret-minimum-32-chars-long \
          APP_URL=http://localhost:3000 \
          DATABASE_PATH=/tmp/test.db \
          SMTP_HOST= \
          VAPID_PUBLIC_KEY= \
          VAPID_PRIVATE_KEY= \
          npm run start &
          sleep 5
          curl -f http://localhost:3000/health
        env:
          PORT: 3000

      - name: Install Playwright browsers
        run: cd tests && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd tests && BASE_URL=http://localhost:3000 npm test
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: tests/screenshots/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Security Scans
  # ─────────────────────────────────────────────────────────────────────
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run npm audit (backend)
        run: cd backend && npm audit --audit-level=high || true

      - name: Run npm audit (mobile)
        run: cd mobile-apps && npm audit --audit-level=high || true

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Check for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml

      - name: Generate SBOM (CycloneDX)
        run: |
          cd backend && npx @cyclonedx/bom -o ../sbom-backend.json
          cd ../mobile-apps && npx @cyclonedx/bom -o ../sbom-mobile.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Docker Build & Push
  # ─────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck, backend-tests, mobile-tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ─────────────────────────────────────────────────────────────────────
  # Migration Test (Fresh + Upgrade)
  # ─────────────────────────────────────────────────────────────────────
  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Build backend
        run: cd backend && npm run build

      - name: Test fresh install migration
        run: |
          cd backend
          DATABASE_PATH=/tmp/fresh.db \
          npx drizzle-kit migrate
          # Verify schema
          sqlite3 /tmp/fresh.db ".schema" | head -100

      - name: Test upgrade migration (from previous release)
        run: |
          # This would test upgrading from the previous release tag
          # For now, verify migrations are idempotent
          cd backend
          DATABASE_PATH=/tmp/upgrade.db \
          npx drizzle-kit migrate
          npx drizzle-kit migrate  # Run twice - should be idempotent

      - name: Verify migration integrity
        run: |
          cd backend
          for db in /tmp/fresh.db /tmp/upgrade.db; do
            sqlite3 "$db" "PRAGMA integrity_check;"
            sqlite3 "$db" "PRAGMA foreign_key_check;"
          done

  # ─────────────────────────────────────────────────────────────────────
  # Deploy to Staging
  # ─────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker-build, migration-test, e2e-tests, security-scans]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging server via SSH/Ansible/Tailscale"
          # Example: ssh staging "cd /opt/pocket-diary && docker compose pull && docker compose up -d"
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}

      - name: Smoke test staging
        run: |
          sleep 10
          curl -f https://staging.notes.example.com/health

  # ─────────────────────────────────────────────────────────────────────
  # Deploy to Production
  # ─────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-build, migration-test, e2e-tests, security-scans]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploy to production via blue/green or rolling update"
          # Example: SSH to prod, pull new image, health check, switch traffic
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

      - name: Health check production
        run: |
          sleep 15
          curl -f https://notes.example.com/health

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

  # ─────────────────────────────────────────────────────────────────────
  # Dependency Update (Weekly)
  # ─────────────────────────────────────────────────────────────────────
  dependency-update:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check outdated (backend)
        run: cd backend && npm outdated --json || true

      - name: Check outdated (mobile)
        run: cd mobile-apps && npm outdated --json || true

      - name: Create dependabot PRs
        run: |
          echo "Dependabot handles PR creation automatically"
          echo "Review and merge dependabot PRs weekly"